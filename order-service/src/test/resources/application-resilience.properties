spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop


resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=10ms
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=4
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=60s

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

app.security.user.password=test-user-pw
app.security.admin.password=test-admin-pw

app.security.jwt.secret=test-only-secret-that-is-at-least-32-bytes-long
app.security.jwt.expiry-minutes=30