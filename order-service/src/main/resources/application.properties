spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=order_user
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info

inventory.base-url=http://localhost:8081

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Retry (used on the read call in this round)
resilience4j.retry.instances.inventory.max-attempts=3
resilience4j.retry.instances.inventory.wait-duration=500ms
resilience4j.retry.instances.inventory.retry-exceptions=com.abhijit.order_service.order.InventoryUnavailableException

# Circuit breaker, shared by all Inventory calls
resilience4j.circuitbreaker.instances.inventory.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventory.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.inventory.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.inventory.record-exceptions=com.abhijit.order_service.order.InventoryUnavailableException

# Make the state visible
management.endpoints.web.exposure.include=health,info,circuitbreakers,retries
management.health.circuitbreakers.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}