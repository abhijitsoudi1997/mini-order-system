spring.application.name=api-gateway
server.port=8080

# Eureka (same local timers as the other services)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

# Route 1: /api/products/** -> inventory-service /products/**
spring.cloud.gateway.server.webflux.routes[0].id=inventory-products
spring.cloud.gateway.server.webflux.routes[0].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[0].filters[1]=RewriteResponseHeader=Location, ^https?://[^/]+/, /api/

# Route 2: /api/orders/** -> order-service /orders/**
spring.cloud.gateway.server.webflux.routes[1].id=order-orders
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].filters[1]=RewriteResponseHeader=Location, ^https?://[^/]+/, /api/

management.endpoints.web.exposure.include=health,info,gateway

# How long the gateway waits for a service (otherwise the client gets 504)
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s