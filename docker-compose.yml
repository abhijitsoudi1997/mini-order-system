name: mini-order-system

services:
  mysql:
    image: mysql:8.4
    mem_limit: 1g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  zipkin:
    image: openzipkin/zipkin
    restart: on-failure
    mem_limit: 512m
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "9411:9411"

  eureka:
    build: ./discovery-server
    image: discovery-server:1.0
    restart: on-failure
    mem_limit: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50"
    volumes:
      - ./docker/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh", "8761", "/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "8761:8761"

  inventory-service:
    build: ./inventory-service
    image: inventory-service:1.0
    restart: on-failure
    mem_limit: 768m
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_user
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: inventory-service
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ./docker/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh", "8081", "/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "8081:8081"

  order-service:
    build: ./order-service
    image: order-service:1.0
    restart: on-failure
    mem_limit: 768m
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: order_user
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      ORDER_USER_PASSWORD: ${ORDER_USER_PASSWORD:?set ORDER_USER_PASSWORD in .env}
      ORDER_ADMIN_PASSWORD: ${ORDER_ADMIN_PASSWORD:?set ORDER_ADMIN_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ./docker/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh", "8082", "/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "8082:8082"

  api-gateway:
    build: ./api-gateway
    image: api-gateway:1.0
    restart: on-failure
    mem_limit: 512m
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ./docker/healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/healthcheck.sh", "8080", "/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - "8080:8080"

volumes:
  mysql-data:
